<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pdf-aligner</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar">
        <h1 class="title">pdf-aligner</h1>
        <button type="button" id="pick">PDFを選択</button>
        <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
        <label class="field">列数:
          <input type="number" id="columns" min="1" step="1" inputmode="numeric" disabled />
        </label>
        <label class="field">区切り(各画像の先頭ページ):
          <input type="text" id="separators" class="separators" placeholder="例: 5, 12, 20" autocomplete="off" spellcheck="false" disabled />
        </label>
        <select id="segment" class="segment" aria-label="表示するセグメント" disabled></select>
        <div class="zoom" role="group" aria-label="ズーム">
          <button type="button" id="zoom-out" aria-label="縮小">−</button>
          <button type="button" id="zoom-level" class="zoom-level" title="押すと 100% にします">100%</button>
          <button type="button" id="zoom-in" aria-label="拡大">＋</button>
          <button type="button" id="zoom-fit">画面に合わせる</button>
        </div>
        <div class="save-group" role="group" aria-label="PNG で保存">
          <button type="button" id="download">PNGをダウンロード</button>
          <button type="button" id="download-all" title="Chrome が複数ファイルのダウンロードの確認を出したら、「許可」を選んでください" disabled>すべてPNGをダウンロード</button>
        </div>
        <div class="save-group" role="group" aria-label="PDF で保存">
          <button type="button" id="download-pdf" title="元のページをそのまま切り出した PDF を保存します" disabled>PDFをダウンロード</button>
          <button type="button" id="download-all-pdf" title="Chrome が複数ファイルのダウンロードの確認を出したら、「許可」を選んでください" disabled>すべてPDFをダウンロード</button>
        </div>
      </header>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="workspace">
        <aside id="thumbnails" class="thumbnails" aria-label="元PDFのページ一覧" hidden></aside>
        <main id="preview" class="preview" tabindex="0">
          <p id="placeholder" class="placeholder">PDFをここにドロップ</p>
          <div id="stage" class="stage" hidden>
            <canvas id="canvas"></canvas>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
